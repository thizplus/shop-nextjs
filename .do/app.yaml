# .do/app.yaml
name: vip66i-nextjs
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    git:
      branch: main
      repo_clone_url: https://github.com/git-wppluz/ecom-nextjs-docker.git
    health_check:
      http_path: /
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    envs:
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_TIME
        value: ${APP_URL} # DigitalOcean จะใส่ค่านี้ให้อัตโนมัติ
      - key: NEXT_PUBLIC_SERVER_URL
        scope: RUN_TIME
        value: 'https://your-backend-url.ondigitalocean.app' # สามารถแก้ไขได้ทีหลัง
      - key: NEXT_PUBLIC_SITE_NAME
        scope: RUN_TIME
        value: 'VIP66I'
